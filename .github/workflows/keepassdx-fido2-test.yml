name: KeePassDX FIDO2 test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/keepassdx-fido2-test.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ordanexa/KeePassDX-FIDO2
          ref: 7c69d2605ab0a13d85d5c6a6272ce7c97819973d
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Independent protocol checks
        run: |
          python3 -m venv /tmp/fido-tests
          /tmp/fido-tests/bin/pip install -r tests/fido2/requirements.txt
          FIDO_TEST_PYTHON=/tmp/fido-tests/bin/python bash tests/fido2/run.sh
      - name: Install Android build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - name: Build unsigned test variant
        run: ./gradlew :app:testFido2ReleaseUnitTest --tests 'com.kunzisoft.keepass.fido2.*' :app:assembleFido2Release --no-daemon --console=plain
      - name: Sign with existing identity and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.READER_KEYSTORE_BASE64 }}
          READER_STORE_PASS: ${{ secrets.READER_SIGNING_PASSWORD }}
          READER_KEY_PASS: ${{ secrets.READER_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$READER_STORE_PASS"
          umask 077
          signing_file="$RUNNER_TEMP/keepassdx-test-signing.p12"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          unset KEYSTORE_BASE64
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/fido2/release/app-fido2-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_file" --ks-key-alias fidoparole-reader --ks-pass env:READER_STORE_PASS --key-pass env:READER_KEY_PASS --out dist/keepassdx-fido2-0.1.9-test.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs dist/keepassdx-fido2-0.1.9-test.apk > "$RUNNER_TEMP/signature.txt"
          grep -Fq '707f6d453412ec20afbf0aa498d6c63d07c3d4548688030b45f5cd7b04c8b485' "$RUNNER_TEMP/signature.txt"
          "$tools/zipalign" -c -P 16 4 dist/keepassdx-fido2-0.1.9-test.apk
          "$tools/aapt" dump badging dist/keepassdx-fido2-0.1.9-test.apk > "$RUNNER_TEMP/badging.txt"
          head -5 "$RUNNER_TEMP/badging.txt"
          cd dist
          sha256sum *.apk > SHA256SUMS
          printf '%s\n' '7c69d2605ab0a13d85d5c6a6272ce7c97819973d' > SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keepassdx-fido2-test-7c69d26
          path: dist/
          if-no-files-found: error
          retention-days: 90
