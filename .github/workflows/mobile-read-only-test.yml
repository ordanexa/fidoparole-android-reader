name: Build FidoParole Mobile read-only test
on:
  push:
    branches: [build/mobile-read-only-0.1.0]
    paths: [.github/workflows/mobile-read-only-test.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ordanexa/fidoparole-mobile
          ref: 3993edb52271a634cdaa4a91488f50bf0ce34763
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android and Rust build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Rust core and binding tests
        run: cargo test --workspace --locked
      - name: Android tests and release build
        working-directory: android
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest assembleRelease
      - name: Sign and verify fork APK
        env:
          KEYSTORE_BASE64: ${{ secrets.READER_KEYSTORE_BASE64 }}
          READER_STORE_PASS: ${{ secrets.READER_SIGNING_PASSWORD }}
          READER_KEY_PASS: ${{ secrets.READER_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$READER_STORE_PASS"
          umask 077
          signing_file="$RUNNER_TEMP/mobile-signing.p12"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          unset KEYSTORE_BASE64
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for variant in arm64-v8a universal; do
            "$tools/zipalign" -P 16 -f 4 "android/app/build/outputs/apk/release/app-$variant-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            suffix="$variant"
            if [ "$variant" = arm64-v8a ]; then suffix=arm64; fi
            apk="dist/fidoparole-mobile-ordanexa-0.1.1-test-$suffix.apk"
            "$tools/apksigner" sign --ks "$signing_file" --ks-key-alias fidoparole-reader --ks-pass env:READER_STORE_PASS --key-pass env:READER_KEY_PASS --out "$apk" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
            grep -Fx 'Signer #1 certificate SHA-256 digest: 707f6d453412ec20afbf0aa498d6c63d07c3d4548688030b45f5cd7b04c8b485' "$RUNNER_TEMP/signature.txt"
            "$tools/zipalign" -c -P 16 4 "$apk"
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            grep -F "package: name='com.ordanexa.fidoparole.mobile' versionCode='6' versionName='0.3.0-ordanexa.0.1.1-test'" "$RUNNER_TEMP/badging.txt"
            if [ "$variant" = arm64-v8a ]; then
              grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
            else
              grep -Fx "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86_64'" "$RUNNER_TEMP/badging.txt"
            fi
          done
          cd dist
          sha256sum *.apk > SHA256SUMS
          printf '%s\n' '3993edb52271a634cdaa4a91488f50bf0ce34763' > SOURCE_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-read-only-signed
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-read-only-test-results
          path: |
            android/app/build/test-results/
            android/app/build/screens/
          retention-days: 30
